# Apache settings for the web container: serves the built React site and forwards /api to the backend container.
ServerName localhost

<Directory "/usr/local/apache2/htdocs">
    Require all granted
    Options -Indexes +FollowSymLinks
    AllowOverride None

    # Any path that is not a real file returns index.html, so refreshing a page such as /orders works.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>

ProxyPreserveHost On
# Never act as a forward proxy.
ProxyRequests Off

# Forward /api to the backend container so the browser sees one address and CORS is not needed.
ProxyPass        /api  http://backend:5001/api
ProxyPassReverse /api  http://backend:5001/api
