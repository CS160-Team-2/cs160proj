# OFS virtual host: serves the built React site and forwards /api to Flask. Install steps are in deploy/APACHE.md.

# Listen on 8080 so nothing on Apache's default port is disturbed.
Listen 8080

<VirtualHost *:8080>

    ServerName localhost

    # The built React site; __DIST__ is replaced with the real folder when this file is installed.
    DocumentRoot "__DIST__"

    <Directory "__DIST__">
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # Any path that is not a real file returns index.html, so refreshing a page such as /orders works.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    ProxyPreserveHost On
    # Never act as a forward proxy.
    ProxyRequests Off

    # Forward /api to Flask so the browser sees one address and CORS is not needed.
    ProxyPass        /api  http://127.0.0.1:5001/api
    ProxyPassReverse /api  http://127.0.0.1:5001/api

    <Location /api>
        Require all granted
    </Location>

    # Logs: look at ofs_error.log first when something fails.
    ErrorLog  "/var/log/apache2/ofs_error.log"
    CustomLog "/var/log/apache2/ofs_access.log" combined

</VirtualHost>
