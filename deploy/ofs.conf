# OFS — Apache virtual host
# =====================================================================
# DO NOT EDIT THE PATHS BY HAND. Two commands install this (APACHE.md
# Part 4 explains both):
#
#   cd <project folder>
#   bash deploy/publish.sh          # copies the build where Apache can read it
#   sed "s|__DIST__|/Library/WebServer/Documents/ofs|g" deploy/ofs.conf \
#     | sudo tee /etc/apache2/other/ofs.conf > /dev/null
#
# Apache loads every .conf in /etc/apache2/other/ automatically, so
# there is nothing to uncomment and no other file to edit.
#
# NOTE — why DocumentRoot is NOT the project folder on macOS:
# Apache runs as the user `_www`, which cannot traverse ~/Desktop or
# ~/Documents (owner-only permissions plus macOS TCC). Pointing
# DocumentRoot at frontend/dist there returns 403 Forbidden even though
# `apachectl configtest` reports Syntax OK. publish.sh copies the build
# to /Library/WebServer/Documents/ofs, which is world-readable by
# design — and which mirrors how real deployment works: build an
# artifact, then deploy the artifact.
#
# What this does, and why the spike includes it:
#
#   1. Serves the BUILT React bundle as static files (frontend/dist).
#      Vite's dev server is not used in production.
#
#   2. Reverse-proxies /api to Flask, so the browser sees ONE origin.
#      This is what makes CORS unnecessary in production — a finding
#      worth recording, because it means the CORS config in app.py is a
#      development-only concern.
#
# Required modules: mod_proxy, mod_proxy_http, mod_rewrite (APACHE.md
# Part 2 enables them in one command).
# =====================================================================

# Listen here as well as on Apache's default port. Declaring it in this
# file means httpd.conf never has to be edited.
Listen 8080

<VirtualHost *:8080>

    ServerName localhost

    # --- 1. Static React bundle --------------------------------------
    DocumentRoot "__DIST__"

    <Directory "__DIST__">
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None

        # Single-page-app fallback: React Router owns the URLs, so any
        # path that is not a real file must return index.html rather
        # than a 404. Without this, refreshing the page on /orders
        # breaks — a classic first-deploy bug.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # --- 2. Reverse proxy to Flask -----------------------------------
    # /api/anything  ->  http://127.0.0.1:5001/api/anything
    # Everything else is served from DocumentRoot above.

    ProxyPreserveHost On
    ProxyRequests Off                      # never act as a forward proxy

    ProxyPass        /api  http://127.0.0.1:5001/api
    ProxyPassReverse /api  http://127.0.0.1:5001/api

    <Location /api>
        Require all granted
    </Location>

    # --- Logging ------------------------------------------------------
    # Check these first when something 500s or 404s:
    #   tail -f /var/log/apache2/ofs_error.log
    ErrorLog  "/var/log/apache2/ofs_error.log"
    CustomLog "/var/log/apache2/ofs_access.log" combined

</VirtualHost>

# =====================================================================
# Notes
# =====================================================================
# Port 8080, not 80, so nothing collides with anything else already
# serving on the default port.
#
# The Flask development server (`python app.py`) is fine BEHIND Apache
# for a class demonstration, but it is single-threaded and explicitly
# not for production. The production-grade option is mod_wsgi or
# Waitress behind the same proxy — a Part III decision, not a spike one.
#
# Waitress is the easier cross-platform choice if the team wants one
# later: it is pure Python and works identically on Windows and macOS,
# where Gunicorn does not run on Windows at all.
# =====================================================================
